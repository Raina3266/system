[package]
name = "rofi-network-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Rofi network controller backed by nmrs and NetworkManager"
license = "MIT"
publish = false

[dependencies]
nmrs = "=3.4.2"
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

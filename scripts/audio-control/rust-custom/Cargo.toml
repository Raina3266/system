[package]
name = "audio-control"
version.workspace = true
edition.workspace = true

# Rust owns panel policy, scheduling and transactions. Astal supplies canonical
# state and executes Rust-selected native controls; no alternative audio backend.
[lib]
name = "audio_control"
path = "src/lib.rs"

[[bin]]
name = "audio-control"
path = "src/main.rs"

[[test]]
name = "tests"
path = "src/tests.rs"

[dependencies]
# Pair and its request-local agent must share one BlueZ connection.
bluer = { version = "0.17", default-features = false, features = [
  "bluetoothd",
] }
# System-bus export of HID++ battery levels through BlueZ's provider API
# (bt-battery-provider.service).
zbus = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

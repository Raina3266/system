[workspace]
members = [
  "audio-control/rust-custom",
  "clipboard/rust-custom",
  "media-control/rust-custom",
  "network-manager/rust-custom",
  "ocr-screenshot",

  "waybar-timer",
  "webcam-crop",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# These crates sit blocked on a subprocess or a D-Bus round trip, so LTO buys
# little at runtime and costs plenty at build time. Keep strip.
[profile.release]
strip = true

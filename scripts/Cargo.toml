[workspace]
members = [
  "audio-control",
  "control-centre",
  "ocr-screenshot",
  "preview-panel",
  "rofi-clipboard",
  "rofi-filesearch",
  "rofi-network",
  "waybar-timer",
  "webcam-crop",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# These crates are rofi launchers, waybar modules and one-shot CLI tools: they
# spend their lives blocked on a subprocess or a D-Bus round trip, so whole-program
# optimisation buys nothing measurable at runtime. It costs plenty at build time
# though — on rofi-clipboard, the smallest crate here that has dependencies,
# `lto = true` with `codegen-units = 1` took 27s to build the binary and its test
# harness against 9s on the defaults, and the gap widens on preview-panel (gtk4)
# and audio-control (bluer). Keep strip so the closure stays small.
[profile.release]
strip = true

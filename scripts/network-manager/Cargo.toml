[package]
# Keep the package id stable until the workspace owner reconciles Cargo.lock.
# The installed executable and repository directory are `network-manager`.
name = "rofi-network"
version.workspace = true
edition.workspace = true

[[bin]]
name = "network-manager"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"

[package]
# Keep the Cargo package id stable so Cargo.lock does not churn solely because
# the front-end grew into a shared network backend. The installed executable
# and repository directory are both `network-manager`.
name = "rofi-network"
version.workspace = true
edition.workspace = true

[[bin]]
name = "network-manager"
path = "src/main.rs"

[dependencies]
nmrs = "=3.4.2"
# "time" is unused here, but audio-control asks for it and the shared dependency
# artifact is compiled with features unified across the workspace. Asking for
# the same set is what lets this crate reuse that tokio instead of compiling
# its own copy.
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread", "time"] }

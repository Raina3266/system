[package]
name = "control-centre"
version.workspace = true
edition = "2021"

[[bin]]
name = "control-centre"
path = "src/main.rs"

[dependencies]
# The panel itself: a layer-shell surface anchored under Waybar.
gtk = { package = "gtk4", version = "=0.11.4", features = ["v4_6"] }
gtk4-layer-shell = "=0.8.0"
# MPRIS players, and Wayle's own dropdown toggle, over the session bus.
zbus = "=5.18.0"
# CPU, memory, disk and temperature for the system card.
sysinfo = "=0.33.1"
# The calendar cache waybar-ycal writes.
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Deriving the D-Bus type of a notification entry.
serde = { version = "1", features = ["derive"] }

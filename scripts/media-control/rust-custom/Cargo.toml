[package]
name = "media-control"
version.workspace = true
edition.workspace = true

[[test]]
name = "tests"
path = "src/tests.rs"

[dependencies]
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
# Seek positions must round-trip exactly for the frontend's binary64 guard.
serde_json = { version = "1", features = ["float_roundtrip"] }

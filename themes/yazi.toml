# Yazi theme — Cyberpunk palette.
# Linked directly to ~/.config/yazi/theme.toml for live editing.

[filetype]
rules = [
  { url = "*/", fg = "#7afcff", bold = true },
  { mime = "image/*", fg = "#6af6a8" },
  { url = "*.{bmp,webp,svg,ico,tif,tiff,heic,heif,avif,jxl,cr2,cr3,nef,arw,dng,raw,orf,rw2}", fg = "#6af6a8" },
  { mime = "video/*", fg = "#ffe66d" },
  { mime = "audio/*", fg = "#f29e74" },
  { mime = "application/pdf", fg = "#c200fb" },
  { mime = "application/vnd.openxmlformats-*", fg = "#c200fb" },
  { mime = "application/vnd.ms-*", fg = "#c200fb" },
  { mime = "application/msword", fg = "#c200fb" },
  { mime = "application/vnd.oasis.opendocument.*", fg = "#c200fb" },
  { url = "*.{doc,docx,ppt,pptx,xls,xlsx,csv,odt,ods,odp}", fg = "#c200fb" },
  { mime = "application/{,g}zip", fg = "#7afcff" },
  { mime = "application/x-{tar,bzip2,7z-compressed,xz,rar}", fg = "#7afcff" },
  { mime = "application/java-archive", fg = "#7afcff" },
  { mime = "text/*", fg = "#ffffff" },
  { mime = "application/javascript", fg = "#ffffff" },
  { mime = "application/x-shellscript", fg = "#ffffff" },
  { mime = "application/x-python", fg = "#ffffff" },
  { mime = "application/x-rust", fg = "#ffffff" },
  { mime = "application/json", fg = "#ffffff" },
  { mime = "application/toml", fg = "#ffffff" },
  { mime = "application/yaml", fg = "#ffffff" },
  { mime = "application/xml", fg = "#ffffff" },
  { mime = "application/x-executable", fg = "#5c6776" },
  { mime = "application/x-sharedlib", fg = "#5c6776" },
  { url = "*", fg = "#cbe3e7" },
]

[mgr]
cwd = { fg = "#7afcff", bold = true }
find_keyword = { fg = "#ff3333", bold = true }
find_position = { fg = "#ff3333" }
marker_copied = { fg = "#7afcff" }
marker_cut = { fg = "#ff7edb" }
marker_selected = { fg = "#ff3333" }
count_copied = { fg = "#7afcff" }
count_cut = { fg = "#ff7edb" }
count_selected = { fg = "#ff7edb" }
border_symbol = "│"
border_style = { fg = "#ff7edb" }

[indicator]
parent = { fg = "#0E0616", bg = "#ff7edb", bold = true }
current = { fg = "#0E0616", bg = "#ff7edb", bold = true }
preview = { fg = "#0E0616", bg = "#ff7edb", bold = false }

[tabs]
active = { fg = "#0a0a14", bg = "#ff7edb", bold = true }
inactive = { fg = "#5c6776" }

[mode]
normal_main = { fg = "#0a0a14", bg = "#ff7edb", bold = true }
normal_alt = { fg = "#ff7edb", bg = "#0E0616" }
select_main = { fg = "#0a0a14", bg = "#7afcff", bold = true }
select_alt = { fg = "#7afcff", bg = "#0E0616" }
unset_main = { fg = "#0a0a14", bg = "#5c6776" }
unset_alt = { fg = "#5c6776", bg = "#0E0616" }

[status]
overall = { fg = "#cbe3e7", bg = "#0a0a14" }
perm_type = { fg = "#7afcff" }
perm_read = { fg = "#f29e74" }
perm_write = { fg = "#ff3333" }
perm_exec = { fg = "#ff7edb" }
perm_sep = { fg = "#5c6776" }
progress_label = { bold = true }
progress_normal = { fg = "#cbe3e7", bg = "#0E0616" }
progress_error = { fg = "#ff3333", bg = "#0E0616" }

[which]
mask = { bg = "#0a0a14" }
cand = { fg = "#ff7edb", bold = true }
rest = { fg = "#7afcff" }
desc = { fg = "#cbe3e7" }
separator = "  "
separator_style = { fg = "#5c6776" }

[confirm]
border = { fg = "#ff7edb" }
title = { fg = "#7afcff", bold = true }
body = { fg = "#cbe3e7" }
list = { fg = "#cbe3e7" }
btn_yes = { fg = "#0a0a14", bg = "#ff7edb", bold = true }
btn_no = { fg = "#cbe3e7", bg = "#0E0616" }
btn_labels = ["Yes", "No"]

[spot]
border = { fg = "#ff7edb" }
title = { fg = "#7afcff", bold = true }
tbl_col = { fg = "#ff7edb" }
tbl_cell = { fg = "#7afcff" }

[notify]
title_info = { fg = "#7afcff" }
title_warn = { fg = "#f29e74" }
title_error = { fg = "#ff3333" }

[pick]
border = { fg = "#ff7edb" }
active = { fg = "#ff7edb", bold = true }
inactive = { fg = "#5c6776" }

[input]
border = { fg = "#ff7edb" }
title = { fg = "#7afcff" }
value = { fg = "#cbe3e7" }
selected = { fg = "#0a0a14", bg = "#ff7edb" }

[cmp]
border = { fg = "#ff7edb" }
active = { fg = "#ff7edb", bold = true }
inactive = { fg = "#5c6776" }

[tasks]
border = { fg = "#ff7edb" }
title = { fg = "#7afcff" }
hovered = { fg = "#ff7edb", bold = true }

[help]
on = { fg = "#ff7edb", bold = true }
run = { fg = "#7afcff" }
desc = { fg = "#cbe3e7" }
hovered = { fg = "#0a0a14", bg = "#ff7edb" }
footer = { fg = "#5c6776" }
